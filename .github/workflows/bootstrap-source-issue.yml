name: Bootstrap source from issue trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.issue.title == 'bootstrap-notesnotes-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* > source.zip.b64
          base64 --decode source.zip.b64 > source.zip
          echo "3d77f581a04ae645a6de05158bb55d221f953fff64b3de5dcba9d0c90ad62d93  source.zip" | sha256sum -c -
          unzip -o source.zip
          rm -rf .bootstrap source.zip source.zip.b64 .github/workflows/bootstrap-source.yml .github/workflows/bootstrap-source-issue.yml
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Resonote MVP source"
          git push
